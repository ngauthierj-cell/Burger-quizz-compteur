<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#c8102e">
<title>Compteur de Miams</title>
<style>
  :root {
    --ketchup: #c8102e;
    --ketchup-dark: #8e0b20;
    --mayo: #f7e7a6;
    --mayo-dark: #e9cf6b;
    --mustard: #f2b705;
    --cream: #fff6e0;
    --ink: #1c1410;
    --brown: #4a2511;
    --tile-a: #141414;
    --tile-b: #f4efe3;
    --chrome: linear-gradient(180deg, #ffffff 0%, #c9ccd1 35%, #8d9299 50%, #d9dce0 65%, #ffffff 100%);
    --font: "Arial Rounded MT Bold", "Varela Round", "Nunito", "Quicksand", ui-rounded, "SF Pro Rounded", "Trebuchet MS", system-ui, sans-serif;
    --radius: clamp(14px, 2.6vmin, 28px);
    --gap: clamp(8px, 1.6vmin, 20px);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }

  body {
    margin: 0;
    font-family: var(--font);
    font-weight: 900;
    color: var(--ink);
    background-color: var(--tile-b);
    background-image:
      linear-gradient(180deg, rgba(0,0,0,.25), rgba(0,0,0,0) 30%, rgba(0,0,0,0) 70%, rgba(0,0,0,.3)),
      conic-gradient(var(--tile-a) 25%, var(--tile-b) 0 50%, var(--tile-a) 0 75%, var(--tile-b) 0);
    background-size: 100% 100%, clamp(36px, 7vmin, 90px) clamp(36px, 7vmin, 90px);
    background-attachment: fixed;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
    overflow-x: hidden;
  }

  .app {
    min-height: 100vh;
    min-height: 100dvh;
    display: flex;
    flex-direction: column;
    gap: var(--gap);
    padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right)) max(12px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left));
    max-width: 1800px;
    margin: 0 auto;
  }

  button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
  button:focus-visible, input:focus-visible { outline: 4px solid var(--mustard); outline-offset: 3px; }

  /* ---------- Enseigne ---------- */
  .sign {
    display: flex;
    align-items: center;
    gap: var(--gap);
    background: var(--ketchup);
    border-radius: var(--radius);
    padding: clamp(8px, 1.4vmin, 18px) clamp(12px, 2vmin, 26px);
    box-shadow: 0 0 0 4px var(--cream), 0 0 0 8px var(--ketchup-dark), 0 10px 24px rgba(0,0,0,.45);
    margin: 4px 4px 0;
  }
  .sign h1 {
    flex: 1;
    margin: 0;
    font-size: clamp(22px, 5vmin, 64px);
    line-height: 1;
    letter-spacing: .02em;
    color: var(--cream);
    text-shadow: 3px 3px 0 var(--ketchup-dark), 0 0 18px rgba(255, 220, 150, .55);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .sign h1 span { color: var(--mustard); }
  .tools { display: flex; gap: 8px; }
  .icon-btn {
    width: clamp(44px, 6.5vmin, 76px);
    height: clamp(44px, 6.5vmin, 76px);
    border: 0;
    border-radius: 50%;
    background: var(--cream);
    color: var(--ketchup);
    display: grid;
    place-items: center;
    box-shadow: inset 0 -4px 0 rgba(0,0,0,.18), 0 3px 0 var(--ketchup-dark);
  }
  .icon-btn svg { width: 55%; height: 55%; }
  .icon-btn:active { transform: translateY(2px); box-shadow: inset 0 -2px 0 rgba(0,0,0,.18), 0 1px 0 var(--ketchup-dark); }
  .icon-btn[hidden] { display: none; }

  /* ---------- Manches ---------- */
  .rounds {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: var(--gap);
    background: var(--cream);
    border-radius: 999px;
    padding: 6px;
    border: 4px solid transparent;
    background-image: linear-gradient(var(--cream), var(--cream)), var(--chrome);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    box-shadow: 0 8px 18px rgba(0,0,0,.35);
  }
  .nav-btn {
    width: clamp(48px, 7.5vmin, 90px);
    height: clamp(48px, 7.5vmin, 90px);
    border-radius: 50%;
    border: 0;
    background: var(--mustard);
    color: var(--brown);
    font-size: clamp(22px, 4vmin, 44px);
    line-height: 1;
    display: grid;
    place-items: center;
    box-shadow: inset 0 -5px 0 rgba(0,0,0,.18);
  }
  .nav-btn:disabled { opacity: .35; cursor: default; }
  .nav-btn:not(:disabled):active { transform: scale(.94); }
  .round-info { text-align: center; min-width: 0; }
  .round-label {
    font-size: clamp(10px, 1.6vmin, 18px);
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--ketchup);
  }
  .round-name {
    font-size: clamp(20px, 4.4vmin, 56px);
    line-height: 1.05;
    color: var(--ink);
  }
  .round-hint {
    font-family: system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(11px, 1.7vmin, 20px);
    color: #6b5444;
    margin-top: 2px;
  }
  .dots { display: flex; justify-content: center; gap: 6px; margin-top: 6px; }
  .dots i {
    width: clamp(8px, 1.2vmin, 14px);
    height: clamp(8px, 1.2vmin, 14px);
    border-radius: 50%;
    background: #d9cdb4;
    transition: background .2s, transform .2s;
  }
  .dots i.on { background: var(--ketchup); transform: scale(1.3); }
  .dots i.done { background: var(--mustard); }

  /* ---------- Équipes ---------- */
  .board {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: var(--gap);
    min-height: 0;
  }
  .team {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: var(--gap);
    border-radius: var(--radius);
    padding: clamp(10px, 2vmin, 26px);
    border: clamp(4px, .7vmin, 8px) solid transparent;
    background-origin: border-box;
    background-clip: padding-box, border-box;
    box-shadow: 0 12px 28px rgba(0,0,0,.45);
    overflow: hidden;
    min-width: 0;
  }
  .team::before {
    /* reflet façon formica */
    content: "";
    position: absolute;
    inset: 0;
    background: radial-gradient(120% 60% at 20% 0%, rgba(255,255,255,.22), transparent 60%);
    pointer-events: none;
  }
  .team.ketchup {
    background-image: linear-gradient(160deg, #de1e3a, var(--ketchup) 55%, #a50d25), var(--chrome);
    color: var(--cream);
  }
  .team.mayo {
    background-image: linear-gradient(160deg, #fff3c4, var(--mayo) 55%, var(--mayo-dark)), var(--chrome);
    color: var(--brown);
  }
  .team-name {
    display: flex;
    align-items: center;
    gap: .4em;
    font-size: clamp(20px, 4.4vmin, 60px);
    line-height: 1;
    letter-spacing: .03em;
    text-transform: uppercase;
  }
  .bottle {
    width: .7em;
    height: 1.1em;
    flex: none;
  }
  .score-wrap { flex: 1; display: grid; place-items: center; min-height: 0; text-align: center; }
  .score {
    font-size: clamp(84px, min(24vw, 30vh), 380px);
    line-height: .9;
    font-variant-numeric: tabular-nums;
    letter-spacing: -.02em;
  }
  .team.ketchup .score { text-shadow: 0 .05em 0 var(--ketchup-dark), 0 .09em 0 rgba(0,0,0,.25); }
  .team.mayo .score { color: var(--ketchup); text-shadow: 0 .05em 0 var(--brown), 0 .09em 0 rgba(0,0,0,.18); }
  .unit {
    font-size: clamp(14px, 2.6vmin, 34px);
    letter-spacing: .12em;
    text-transform: uppercase;
    opacity: .9;
  }
  .progress {
    width: 100%;
    height: clamp(8px, 1.4vmin, 16px);
    border-radius: 99px;
    background: rgba(0,0,0,.2);
    overflow: hidden;
  }
  .progress b {
    display: block;
    height: 100%;
    width: 0;
    border-radius: inherit;
    background: var(--mustard);
    transition: width .35s cubic-bezier(.3,1.4,.6,1);
  }
  .team.mayo .progress b { background: var(--ketchup); }
  .to-go {
    font-family: system-ui, sans-serif;
    font-weight: 700;
    font-size: clamp(12px, 1.8vmin, 22px);
    opacity: .9;
    margin-top: -4px;
  }

  .pad {
    width: 100%;
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: clamp(6px, 1.2vmin, 14px);
  }
  .pad button {
    min-height: clamp(56px, 11vmin, 130px);
    border: 0;
    border-radius: clamp(12px, 2vmin, 24px);
    font-size: clamp(22px, 5vmin, 64px);
    line-height: 1;
    transition: transform .06s;
  }
  .pad button:active { transform: translateY(4px); }
  .team.ketchup .pad button { background: var(--cream); color: var(--ketchup); box-shadow: 0 6px 0 var(--ketchup-dark); }
  .team.ketchup .pad button:active { box-shadow: 0 2px 0 var(--ketchup-dark); }
  .team.mayo .pad button { background: var(--brown); color: var(--mayo); box-shadow: 0 6px 0 #2a1408; }
  .team.mayo .pad button:active { box-shadow: 0 2px 0 #2a1408; }
  .pad .plus5 { background: var(--mustard) !important; color: var(--brown) !important; }
  .pad .minus { opacity: .85; font-size: clamp(18px, 3.8vmin, 48px); }

  .bump { animation: bump .45s cubic-bezier(.3,1.6,.5,1); }
  @keyframes bump {
    0% { transform: scale(1); }
    35% { transform: scale(1.18) rotate(-3deg); }
    100% { transform: scale(1); }
  }
  .dip { animation: dip .35s ease; }
  @keyframes dip {
    0% { transform: scale(1); }
    40% { transform: scale(.88); opacity: .7; }
    100% { transform: scale(1); }
  }
  .float {
    position: absolute;
    left: 50%;
    top: 40%;
    font-size: clamp(28px, 7vmin, 90px);
    pointer-events: none;
    animation: float .9s ease-out forwards;
    color: var(--mustard);
    text-shadow: 0 3px 0 rgba(0,0,0,.35);
    z-index: 2;
  }
  @keyframes float {
    from { transform: translate(-50%, 0) scale(.6); opacity: 0; }
    20% { opacity: 1; transform: translate(-50%, -20%) scale(1.1); }
    to { transform: translate(-50%, -160%) scale(1); opacity: 0; }
  }

  /* Portrait étroit : boutons empilés */
  @media (max-width: 560px) and (orientation: portrait) {
    .pad { grid-template-columns: 1fr 1fr; }
    .pad .plus1 { grid-column: 1 / -1; }
    .team-name { font-size: clamp(18px, 6vw, 30px); }
    .score { font-size: clamp(80px, 26vw, 200px); }
  }

  /* ---------- Burger de la Mort ---------- */
  .bdm-panel { display: none; }
  body.bdm .bdm-panel { display: flex; }
  body.bdm .board { flex: none; }
  body.bdm .team { flex-direction: row; justify-content: space-between; padding-block: clamp(8px, 1.4vmin, 16px); }
  body.bdm .team .pad,
  body.bdm .team .progress,
  body.bdm .team .to-go,
  body.bdm .team .unit { display: none; }
  body.bdm .team .score { font-size: clamp(36px, 8vmin, 110px); }
  body.bdm .team .score-wrap { flex: none; }

  .bdm-panel {
    flex: 1;
    flex-direction: column;
    align-items: center;
    gap: var(--gap);
    border-radius: var(--radius);
    padding: clamp(12px, 2.4vmin, 32px);
    background: radial-gradient(120% 80% at 50% 0%, #3a1a10, #140805 70%);
    color: var(--cream);
    border: clamp(4px, .7vmin, 8px) solid transparent;
    background-image: radial-gradient(120% 80% at 50% 0%, #3a1a10, #140805 70%), var(--chrome);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    box-shadow: 0 12px 28px rgba(0,0,0,.5);
  }
  .bdm-title {
    font-size: clamp(22px, 5vmin, 68px);
    color: var(--mustard);
    text-shadow: 0 3px 0 var(--ketchup), 0 0 22px rgba(242,183,5,.4);
    text-align: center;
    line-height: 1;
  }
  .seg {
    display: inline-flex;
    background: rgba(255,255,255,.1);
    border-radius: 999px;
    padding: 4px;
    gap: 4px;
  }
  .seg button {
    border: 0;
    border-radius: 999px;
    padding: clamp(8px, 1.4vmin, 16px) clamp(16px, 3vmin, 36px);
    font-size: clamp(14px, 2.6vmin, 32px);
    background: transparent;
    color: var(--cream);
    opacity: .7;
  }
  .seg button[aria-pressed="true"] { opacity: 1; }
  .seg button.k[aria-pressed="true"] { background: var(--ketchup); }
  .seg button.m[aria-pressed="true"] { background: var(--mayo); color: var(--brown); }

  .bdm-count {
    font-size: clamp(80px, min(22vw, 22vh), 300px);
    line-height: .9;
    font-variant-numeric: tabular-nums;
    color: var(--cream);
    text-shadow: 0 .05em 0 var(--ketchup), 0 .1em 0 rgba(0,0,0,.4);
  }
  .bdm-count small { font-size: .35em; color: var(--mustard); text-shadow: none; }

  .stack {
    width: min(100%, 1100px);
    display: grid;
    grid-template-columns: repeat(10, 1fr);
    gap: clamp(4px, .8vmin, 10px);
  }
  .layer {
    position: relative;
    height: clamp(26px, 5vmin, 64px);
    border-radius: 10px;
    background: rgba(255,255,255,.08);
    border: 2px dashed rgba(255,255,255,.18);
    transition: background .25s, transform .25s, border-color .25s;
  }
  .layer.on { border: 2px solid rgba(0,0,0,.3); transform: translateY(-3px); }
  .layer.on:nth-child(5n+1) { background: #e3a857; }
  .layer.on:nth-child(5n+2) { background: #5bb04a; }
  .layer.on:nth-child(5n+3) { background: var(--mustard); }
  .layer.on:nth-child(5n+4) { background: #e2453b; }
  .layer.on:nth-child(5n+5) { background: #6b3a1e; }
  .layer.milestone::after {
    content: attr(data-label);
    position: absolute;
    top: calc(100% + 6px);
    right: 0;
    white-space: nowrap;
    font-size: clamp(10px, 1.6vmin, 20px);
    color: #c9b79a;
  }
  .layer.milestone.on::after { color: var(--mustard); top: calc(100% + 9px); }

  .bdm-status {
    margin-top: clamp(14px, 2.4vmin, 30px);
    font-size: clamp(16px, 3vmin, 40px);
    text-align: center;
    min-height: 1.2em;
  }
  .bdm-status.win { color: var(--mustard); animation: glow 1s ease-in-out infinite alternate; }
  @keyframes glow { from { text-shadow: 0 0 0 transparent; } to { text-shadow: 0 0 24px rgba(242,183,5,.9); } }

  .bdm-actions {
    width: min(100%, 900px);
    display: grid;
    grid-template-columns: 2fr 1fr 1.4fr;
    gap: clamp(6px, 1.2vmin, 14px);
    margin-top: auto;
  }
  .bdm-actions button {
    min-height: clamp(56px, 10vmin, 120px);
    border: 0;
    border-radius: clamp(12px, 2vmin, 24px);
    font-size: clamp(16px, 3.2vmin, 40px);
    line-height: 1.05;
    padding: 6px 10px;
  }
  .bdm-actions button:active { transform: translateY(4px); }
  .bdm-good { background: var(--mustard); color: var(--brown); box-shadow: 0 6px 0 #a87d00; }
  .bdm-minus { background: var(--cream); color: var(--brown); box-shadow: 0 6px 0 #b9a882; }
  .bdm-fail { background: var(--ketchup); color: var(--cream); box-shadow: 0 6px 0 var(--ketchup-dark); }

  @media (max-width: 560px) and (orientation: portrait) {
    .bdm-actions { grid-template-columns: 1fr 1fr; }
    .bdm-good { grid-column: 1 / -1; }
  }

  /* ---------- Pied ---------- */
  .footer {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: var(--gap);
    background: var(--cream);
    border-radius: var(--radius);
    padding: clamp(8px, 1.4vmin, 16px) clamp(12px, 2vmin, 24px);
    box-shadow: 0 8px 18px rgba(0,0,0,.35);
  }
  .goal {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: clamp(15px, 2.4vmin, 30px);
  }
  .goal input {
    width: 3.4em;
    font: inherit;
    text-align: center;
    padding: 6px 4px;
    border-radius: 12px;
    border: 3px solid var(--mustard);
    background: #fff;
    color: var(--ketchup);
  }
  .hint {
    font-family: system-ui, sans-serif;
    font-weight: 600;
    font-size: clamp(11px, 1.5vmin, 17px);
    color: #6b5444;
  }
  .hint kbd {
    font-family: inherit;
    background: #efe3c6;
    border-radius: 6px;
    padding: 1px 6px;
    border-bottom: 2px solid #cdb98d;
  }
  .new-game {
    border: 0;
    border-radius: 999px;
    padding: clamp(10px, 1.6vmin, 18px) clamp(18px, 3vmin, 36px);
    font-size: clamp(15px, 2.4vmin, 30px);
    background: var(--ink);
    color: var(--cream);
    box-shadow: 0 4px 0 #000;
  }
  .new-game:active { transform: translateY(3px); box-shadow: 0 1px 0 #000; }
  @media (pointer: coarse) { .hint { display: none; } }


  /* Paysage sur petit écran (téléphone couché) : tout doit tenir sans défiler */
  @media (max-height: 520px) and (orientation: landscape) {
    .app { gap: 6px; padding-top: max(6px, env(safe-area-inset-top)); padding-bottom: max(6px, env(safe-area-inset-bottom)); }
    .sign { padding: 4px 12px; box-shadow: 0 0 0 3px var(--cream), 0 0 0 6px var(--ketchup-dark), 0 6px 14px rgba(0,0,0,.4); }
    .sign h1 { font-size: 20px; }
    .icon-btn { width: 36px; height: 36px; }
    .rounds { padding: 2px; border-width: 3px; }
    .nav-btn { width: 40px; height: 40px; font-size: 18px; }
    .round-label, .round-hint, .dots { display: none; }
    .round-name { font-size: 20px; }
    .team { padding: 8px 10px; gap: 6px; }
    .team-name { font-size: 18px; }
    .score { font-size: clamp(56px, 22vh, 120px); }
    .unit { font-size: 12px; }
    .to-go { display: none; }
    .progress { height: 6px; }
    .pad button { min-height: 46px; font-size: 22px; }
    .footer { padding: 4px 12px; }
    .goal, .new-game { font-size: 14px; }
    .new-game { padding: 8px 16px; }
    .bdm-panel { padding: 8px 12px; gap: 6px; }
    .bdm-title { font-size: 20px; }
    .bdm-count { font-size: 64px; }
    .layer { height: 22px; }
    .bdm-status { margin-top: 18px; font-size: 15px; }
    .bdm-actions button { min-height: 46px; font-size: 15px; }
    body.bdm .board, .bdm-title { display: none; }
    body.bdm .footer .goal { display: none; }
    .bdm-panel { flex-direction: row; flex-wrap: wrap; justify-content: center; align-content: center; }
    .bdm-count { font-size: 52px; }
    .stack { order: 3; }
    .bdm-status { order: 4; width: 100%; margin-top: 16px; }
    .bdm-actions { order: 5; margin-top: 0; }
  }

  /* ---------- Modales ---------- */
  .overlay {
    position: fixed;
    inset: 0;
    z-index: 50;
    display: grid;
    place-items: center;
    padding: 16px;
    background: rgba(20, 8, 5, .72);
    opacity: 0;
    visibility: hidden;
    transition: opacity .25s, visibility .25s;
  }
  .overlay.open { opacity: 1; visibility: visible; }
  .card {
    position: relative;
    z-index: 2;
    width: min(100%, 720px);
    background: var(--cream);
    border-radius: var(--radius);
    padding: clamp(18px, 4vmin, 48px);
    text-align: center;
    border: 6px solid transparent;
    background-image: linear-gradient(var(--cream), var(--cream)), var(--chrome);
    background-origin: border-box;
    background-clip: padding-box, border-box;
    box-shadow: 0 20px 60px rgba(0,0,0,.6);
    transform: scale(.85);
    transition: transform .35s cubic-bezier(.3,1.6,.5,1);
  }
  .overlay.open .card { transform: scale(1); }
  .card h2 { margin: 0 0 .3em; font-size: clamp(24px, 5.5vmin, 64px); line-height: 1.05; color: var(--ketchup); }
  .card p { margin: 0 0 1em; font-size: clamp(16px, 3vmin, 34px); line-height: 1.2; }
  .card .actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; }
  .card .actions button {
    flex: 1 1 200px;
    border: 0;
    border-radius: 16px;
    padding: clamp(12px, 2vmin, 22px) 16px;
    font-size: clamp(16px, 2.8vmin, 32px);
  }
  .btn-main { background: var(--ketchup); color: var(--cream); box-shadow: 0 5px 0 var(--ketchup-dark); }
  .btn-alt { background: #e8dcc0; color: var(--brown); box-shadow: 0 5px 0 #c4b38d; }
  .card .actions button:active { transform: translateY(3px); }

  .win-card { background-image: linear-gradient(var(--mustard), #ffd54a), var(--chrome); }
  .win-card h2 { color: var(--ketchup); text-shadow: 0 3px 0 var(--cream); font-size: clamp(30px, 8vmin, 110px); }
  .win-card .big { font-size: clamp(20px, 4.6vmin, 60px); color: var(--brown); }
  .win-card .death { display: inline-block; margin-top: .3em; color: var(--cream); background: var(--ink); border-radius: 12px; padding: .2em .5em; }
  .overlay.open .win-card { animation: wobble 1.2s ease-in-out .3s infinite alternate; }
  @keyframes wobble { from { transform: rotate(-1.5deg) scale(1); } to { transform: rotate(1.5deg) scale(1.03); } }

  .confetti { position: absolute; inset: 0; overflow: hidden; pointer-events: none; z-index: 1; }
  .confetti span {
    position: absolute;
    top: -40px;
    border-radius: 50% 50% 40% 40%;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate3d(var(--dx), 110vh, 0) rotate(var(--rot)); }
  }

  .toast {
    position: fixed;
    left: 50%;
    top: 22%;
    z-index: 40;
    transform: translate(-50%, -20px) scale(.8);
    padding: .3em .8em;
    border-radius: 18px;
    background: var(--mustard);
    color: var(--brown);
    font-size: clamp(30px, 8vmin, 110px);
    box-shadow: 0 0 0 6px var(--cream), 0 0 0 10px var(--ketchup), 0 20px 40px rgba(0,0,0,.5);
    opacity: 0;
    pointer-events: none;
    white-space: nowrap;
    transition: opacity .25s, transform .35s cubic-bezier(.3,1.6,.5,1);
  }
  .toast.show { opacity: 1; transform: translate(-50%, 0) scale(1); }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; animation-iteration-count: 1 !important; transition-duration: .01ms !important; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="sign">
    <h1>Compteur <span>de</span> Miams</h1>
    <div class="tools">
      <button class="icon-btn" id="soundBtn" aria-label="Couper le son" title="Son (S)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/>
          <path class="wave" d="M16.5 8.5a5 5 0 0 1 0 7M19 6a8.5 8.5 0 0 1 0 12"/>
          <path class="mute" d="M16 9l6 6M22 9l-6 6" style="display:none"/>
        </svg>
      </button>
      <button class="icon-btn" id="fsBtn" aria-label="Plein écran" title="Plein écran (F)">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
          <path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/>
        </svg>
      </button>
    </div>
  </header>

  <nav class="rounds" aria-label="Manche en cours">
    <button class="nav-btn" id="prevRound" aria-label="Manche précédente">&#9664;</button>
    <div class="round-info">
      <div class="round-label" id="roundLabel">Manche 1 / 5</div>
      <div class="round-name" id="roundName" aria-live="polite">Nuggets</div>
      <div class="round-hint" id="roundHint"></div>
      <div class="dots" id="dots"></div>
    </div>
    <button class="nav-btn" id="nextRound" aria-label="Manche suivante">&#9654;</button>
  </nav>

  <main class="board">
    <section class="team ketchup" data-team="ketchup" aria-label="Équipe Ketchup">
      <div class="team-name">
        <svg class="bottle" viewBox="0 0 14 22" aria-hidden="true"><path d="M5 0h4v4l2 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7l2-3z" fill="currentColor"/></svg>
        Ketchup
      </div>
      <div class="score-wrap">
        <div>
          <div class="score" id="score-ketchup" aria-live="polite">0</div>
          <div class="unit">Miams</div>
        </div>
      </div>
      <div class="progress"><b id="prog-ketchup"></b></div>
      <div class="to-go" id="togo-ketchup"></div>
      <div class="pad">
        <button class="plus1" data-delta="1" aria-label="Ketchup plus 1">+1</button>
        <button class="plus5" data-delta="5" aria-label="Ketchup plus 5">+5</button>
        <button class="minus" data-delta="-1" aria-label="Ketchup moins 1">&minus;1</button>
      </div>
    </section>

    <section class="team mayo" data-team="mayo" aria-label="Équipe Mayo">
      <div class="team-name">
        <svg class="bottle" viewBox="0 0 14 22" aria-hidden="true"><path d="M5 0h4v4l2 3v13a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7l2-3z" fill="currentColor"/></svg>
        Mayo
      </div>
      <div class="score-wrap">
        <div>
          <div class="score" id="score-mayo" aria-live="polite">0</div>
          <div class="unit">Miams</div>
        </div>
      </div>
      <div class="progress"><b id="prog-mayo"></b></div>
      <div class="to-go" id="togo-mayo"></div>
      <div class="pad">
        <button class="plus1" data-delta="1" aria-label="Mayo plus 1">+1</button>
        <button class="plus5" data-delta="5" aria-label="Mayo plus 5">+5</button>
        <button class="minus" data-delta="-1" aria-label="Mayo moins 1">&minus;1</button>
      </div>
    </section>
  </main>

  <section class="bdm-panel" aria-label="Burger de la Mort">
    <div class="bdm-title">Burger de la Mort</div>
    <div class="seg" role="group" aria-label="Équipe qui affronte le Burger">
      <button class="k" data-bdm-team="ketchup" aria-pressed="true">Ketchup</button>
      <button class="m" data-bdm-team="mayo" aria-pressed="false">Mayo</button>
    </div>
    <div class="bdm-count" aria-live="polite"><span id="bdmCount">0</span><small> / 10</small></div>
    <div class="stack" id="stack"></div>
    <div class="bdm-status" id="bdmStatus"></div>
    <div class="bdm-actions">
      <button class="bdm-good" id="bdmGood">Bonne réponse&nbsp;+1</button>
      <button class="bdm-minus" id="bdmMinus">&minus;1</button>
      <button class="bdm-fail" id="bdmFail">Erreur&nbsp;: retour à 0</button>
    </div>
  </section>

  <footer class="footer">
    <label class="goal">Objectif
      <input id="goalInput" type="number" inputmode="numeric" min="1" max="999" value="25" aria-label="Objectif en Miams">
      Miams
    </label>
    <div class="hint">
      <kbd>K</kbd>/<kbd>M</kbd> +1 · <kbd>⇧</kbd>+<kbd>K</kbd>/<kbd>M</kbd> −1 · <kbd>←</kbd><kbd>→</kbd> manche · <kbd>Espace</kbd> Burger +1
    </div>
    <button class="new-game" id="newGame">Nouvelle partie</button>
  </footer>
</div>

<div class="toast" id="toast" role="status"></div>

<div class="overlay" id="confirmOverlay" role="dialog" aria-modal="true" aria-labelledby="confirmTitle">
  <div class="card">
    <h2 id="confirmTitle">Nouvelle partie&nbsp;?</h2>
    <p>Les scores, la manche et le Burger de la Mort repartent de zéro.</p>
    <div class="actions">
      <button class="btn-alt" id="confirmNo">Annuler</button>
      <button class="btn-main" id="confirmYes">On remet le couvert</button>
    </div>
  </div>
</div>

<div class="overlay" id="winOverlay" role="dialog" aria-modal="true" aria-labelledby="winTitle">
  <div class="confetti" id="confetti"></div>
  <div class="card win-card">
    <h2 id="winTitle">Ketchup&nbsp;!</h2>
    <p class="big" id="winText">25 Miams au compteur&nbsp;!<br><span class="death">Direction le Burger de la Mort&nbsp;!</span></p>
    <div class="actions">
      <button class="btn-alt" id="winStay">Continuer</button>
      <button class="btn-main" id="winGo">Au Burger de la Mort</button>
    </div>
  </div>
</div>

<script>
(function () {
  "use strict";

  var ROUNDS = [
    { name: "Nuggets", hint: "Questions en rafale, chacun son tour" },
    { name: "Sel ou Poivre", hint: "Sel, poivre… ou les deux ?" },
    { name: "Menus", hint: "Un thème au choix, des questions à la chaîne" },
    { name: "L'Addition", hint: "Dernier sprint, chaque Miam compte" },
    { name: "Burger de la Mort", hint: "10 bonnes réponses d'affilée, sans faute" }
  ];
  var BDM_INDEX = ROUNDS.length - 1;
  var TEAMS = { ketchup: "Ketchup", mayo: "Mayo" };
  var STORE_KEY = "compteur-miams-v1";

  var defaults = function () {
    return {
      scores: { ketchup: 0, mayo: 0 },
      goal: 25,
      round: 0,
      bdm: { count: 0, team: "ketchup" },
      muted: false
    };
  };

  /* ---------- Sauvegarde ---------- */
  function load() {
    var s = defaults();
    try {
      var raw = window.localStorage.getItem(STORE_KEY);
      if (raw) {
        var d = JSON.parse(raw);
        if (d && typeof d === "object") {
          if (d.scores) {
            s.scores.ketchup = clampInt(d.scores.ketchup, 0, 9999, 0);
            s.scores.mayo = clampInt(d.scores.mayo, 0, 9999, 0);
          }
          s.goal = clampInt(d.goal, 1, 999, 25);
          s.round = clampInt(d.round, 0, BDM_INDEX, 0);
          if (d.bdm) {
            s.bdm.count = clampInt(d.bdm.count, 0, 10, 0);
            s.bdm.team = d.bdm.team === "mayo" ? "mayo" : "ketchup";
          }
          s.muted = !!d.muted;
        }
      }
    } catch (e) { /* stockage indisponible : on part des valeurs par défaut */ }
    return s;
  }
  function save() {
    try { window.localStorage.setItem(STORE_KEY, JSON.stringify(state)); } catch (e) { /* ignore */ }
  }
  function clampInt(v, min, max, fallback) {
    var n = parseInt(v, 10);
    if (isNaN(n)) return fallback;
    return Math.min(max, Math.max(min, n));
  }

  var state = load();

  /* ---------- Son (Web Audio) ---------- */
  var ctx = null;
  function audio() {
    if (state.muted) return null;
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === "suspended") ctx.resume();
      return ctx;
    } catch (e) { return null; }
  }
  function tone(ac, type, freq, start, dur, vol, endFreq) {
    var o = ac.createOscillator();
    var g = ac.createGain();
    o.type = type;
    o.frequency.setValueAtTime(freq, start);
    if (endFreq) o.frequency.exponentialRampToValueAtTime(endFreq, start + dur);
    g.gain.setValueAtTime(0.0001, start);
    g.gain.exponentialRampToValueAtTime(vol, start + 0.012);
    g.gain.setValueAtTime(vol, start + dur * 0.7);
    g.gain.exponentialRampToValueAtTime(0.0001, start + dur);
    o.connect(g).connect(master(ac));
    o.start(start);
    o.stop(start + dur + 0.05);
  }
  var masterNode = null;
  function master(ac) {
    if (!masterNode) {
      var comp = ac.createDynamicsCompressor();
      var lp = ac.createBiquadFilter();
      lp.type = "lowpass";
      lp.frequency.value = 3200;
      lp.connect(comp).connect(ac.destination);
      masterNode = lp;
    }
    return masterNode;
  }
  // Buzzer de plateau : deux ondes légèrement désaccordées, hauteur selon l'équipe
  function buzz(team, big) {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime;
    var base = team === "mayo" ? 330 : 247;
    tone(ac, "square", base, t, 0.32, 0.16);
    tone(ac, "sawtooth", base * 1.26, t, 0.32, 0.09);
    if (big) {
      tone(ac, "square", base * 1.5, t + 0.16, 0.36, 0.14);
      tone(ac, "square", base * 2, t + 0.3, 0.42, 0.12);
    }
  }
  function blip() {
    var ac = audio(); if (!ac) return;
    tone(ac, "triangle", 300, ac.currentTime, 0.18, 0.15, 150);
  }
  function fanfare() {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime;
    [523, 659, 784, 1047].forEach(function (f, i) {
      tone(ac, "square", f, t + i * 0.13, 0.22, 0.1);
      tone(ac, "triangle", f / 2, t + i * 0.13, 0.22, 0.12);
    });
    tone(ac, "square", 1047, t + 0.55, 0.7, 0.1);
    tone(ac, "square", 1319, t + 0.55, 0.7, 0.07);
    tone(ac, "triangle", 523, t + 0.55, 0.7, 0.14);
  }
  function crash() {
    var ac = audio(); if (!ac) return;
    var t = ac.currentTime;
    tone(ac, "sawtooth", 220, t, 0.6, 0.16, 55);
    tone(ac, "square", 110, t, 0.6, 0.12, 40);
  }

  /* ---------- DOM ---------- */
  var $ = function (id) { return document.getElementById(id); };
  var els = {
    roundLabel: $("roundLabel"), roundName: $("roundName"), roundHint: $("roundHint"), dots: $("dots"),
    prev: $("prevRound"), next: $("nextRound"),
    goal: $("goalInput"), sound: $("soundBtn"), fs: $("fsBtn"),
    bdmCount: $("bdmCount"), stack: $("stack"), bdmStatus: $("bdmStatus"),
    toast: $("toast"), confirm: $("confirmOverlay"), win: $("winOverlay"), confetti: $("confetti")
  };

  ROUNDS.forEach(function () { els.dots.appendChild(document.createElement("i")); });
  for (var i = 1; i <= 10; i++) {
    var l = document.createElement("div");
    l.className = "layer";
    if (i === 5) { l.classList.add("milestone"); l.setAttribute("data-label", "Petit Burger"); }
    if (i === 10) { l.classList.add("milestone"); l.setAttribute("data-label", "Grand Burger"); }
    els.stack.appendChild(l);
  }

  function restart(el, cls) {
    el.classList.remove("bump", "dip");
    void el.offsetWidth;
    el.classList.add(cls);
  }

  function render() {
    ["ketchup", "mayo"].forEach(function (t) {
      var sc = state.scores[t];
      $("score-" + t).textContent = sc;
      $("prog-" + t).style.width = Math.min(100, (sc / state.goal) * 100) + "%";
      var left = state.goal - sc;
      $("togo-" + t).textContent = left > 0
        ? "Encore " + left + " Miam" + (left > 1 ? "s" : "") + " avant le Burger"
        : "Objectif atteint\u00a0!";
    });

    var r = ROUNDS[state.round];
    els.roundLabel.textContent = "Manche " + (state.round + 1) + " / " + ROUNDS.length;
    els.roundName.textContent = r.name;
    els.roundHint.textContent = r.hint;
    Array.prototype.forEach.call(els.dots.children, function (d, idx) {
      d.className = idx === state.round ? "on" : (idx < state.round ? "done" : "");
    });
    els.prev.disabled = state.round === 0;
    els.next.disabled = state.round === BDM_INDEX;
    document.body.classList.toggle("bdm", state.round === BDM_INDEX);

    var c = state.bdm.count;
    els.bdmCount.textContent = c;
    Array.prototype.forEach.call(els.stack.children, function (layer, idx) {
      layer.classList.toggle("on", idx < c);
    });
    document.querySelectorAll("[data-bdm-team]").forEach(function (b) {
      b.setAttribute("aria-pressed", String(b.getAttribute("data-bdm-team") === state.bdm.team));
    });
    var name = TEAMS[state.bdm.team];
    var st = els.bdmStatus;
    st.classList.toggle("win", c >= 5);
    if (c === 0) st.textContent = "À " + name + " de jouer : 10 réponses, sans faute\u00a0!";
    else if (c < 5) st.textContent = "Encore " + (5 - c) + " pour le Petit Burger";
    else if (c < 10) st.textContent = "Petit Burger en poche ! Encore " + (10 - c) + " pour le Grand Burger";
    else st.textContent = "GRAND BURGER pour " + name + "\u00a0!";

    if (document.activeElement !== els.goal) els.goal.value = state.goal;

    els.sound.querySelector(".wave").style.display = state.muted ? "none" : "";
    els.sound.querySelector(".mute").style.display = state.muted ? "" : "none";
    els.sound.setAttribute("aria-label", state.muted ? "Activer le son" : "Couper le son");
    els.sound.setAttribute("aria-pressed", String(state.muted));
  }

  /* ---------- Actions ---------- */
  function addPoints(team, delta) {
    var before = state.scores[team];
    var after = Math.max(0, Math.min(9999, before + delta));
    if (after === before) return;
    state.scores[team] = after;
    save();
    render();
    var scoreEl = $("score-" + team);
    if (delta > 0) {
      restart(scoreEl, "bump");
      floatText(team, "+" + delta);
      buzz(team, delta >= 5);
      if (before < state.goal && after >= state.goal) {
        setTimeout(function () { victory(team); }, 350);
      }
    } else {
      restart(scoreEl, "dip");
      blip();
    }
  }

  function floatText(team, txt) {
    var card = document.querySelector('.team[data-team="' + team + '"]');
    var f = document.createElement("div");
    f.className = "float";
    f.textContent = txt;
    card.appendChild(f);
    setTimeout(function () { f.remove(); }, 950);
  }

  function setRound(r) {
    r = Math.max(0, Math.min(BDM_INDEX, r));
    if (r === state.round) return;
    state.round = r;
    save();
    render();
  }

  var toastTimer = null;
  function toast(msg) {
    els.toast.textContent = msg;
    els.toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { els.toast.classList.remove("show"); }, 1800);
  }

  function bdmAdd(delta) {
    var before = state.bdm.count;
    var after = Math.max(0, Math.min(10, before + delta));
    if (after === before) return;
    state.bdm.count = after;
    save();
    render();
    restart(els.bdmCount, delta > 0 ? "bump" : "dip");
    if (delta > 0) {
      if (after === 10) {
        fanfare();
        celebrate("Grand Burger\u00a0!", TEAMS[state.bdm.team] + " a dévoré les 10 questions\u00a0!", false);
      } else if (after === 5) {
        buzz(state.bdm.team, true);
        toast("Petit Burger\u00a0!");
      } else {
        buzz(state.bdm.team, false);
      }
    } else {
      blip();
    }
  }

  function bdmFail() {
    if (state.bdm.count === 0) return;
    state.bdm.count = 0;
    save();
    render();
    restart(els.bdmCount, "dip");
    crash();
    toast("Le Burger s'écroule\u00a0!");
  }

  /* ---------- Victoire ---------- */
  var winTeam = null;
  function victory(team) {
    winTeam = team;
    fanfare();
    celebrate(TEAMS[team] + " gagne\u00a0!", state.goal + " Miams au compteur\u00a0!", true);
  }

  function celebrate(title, text, showDeath) {
    $("winTitle").textContent = title;
    var p = $("winText");
    p.textContent = text;
    if (showDeath) {
      p.appendChild(document.createElement("br"));
      var s = document.createElement("span");
      s.className = "death";
      s.textContent = "Direction le Burger de la Mort\u00a0!";
      p.appendChild(s);
    }
    $("winGo").style.display = showDeath ? "" : "none";
    $("winStay").textContent = showDeath ? "Continuer" : "Miam\u00a0!";
    spawnConfetti();
    openOverlay(els.win, showDeath ? $("winGo") : $("winStay"));
  }

  function spawnConfetti() {
    var box = els.confetti;
    box.innerHTML = "";
    var colors = ["#c8102e", "#f2b705", "#f7e7a6", "#5bb04a", "#e3a857", "#fff6e0", "#6b3a1e"];
    var n = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches ? 0 : 70;
    for (var k = 0; k < n; k++) {
      var s = document.createElement("span");
      var size = 8 + Math.random() * 18;
      s.style.left = (Math.random() * 100) + "vw";
      s.style.width = size + "px";
      s.style.height = (size * (0.4 + Math.random() * 0.6)) + "px";
      s.style.background = colors[k % colors.length];
      s.style.animationDuration = (2.2 + Math.random() * 2.5) + "s";
      s.style.animationDelay = (Math.random() * 1.2) + "s";
      s.style.setProperty("--dx", ((Math.random() - 0.5) * 30) + "vw");
      s.style.setProperty("--rot", ((Math.random() - 0.5) * 1440) + "deg");
      box.appendChild(s);
    }
  }

  /* ---------- Modales ---------- */
  var lastFocus = null;
  function openOverlay(ov, focusEl) {
    lastFocus = document.activeElement;
    ov.classList.add("open");
    if (focusEl) setTimeout(function () { focusEl.focus(); }, 50);
  }
  function closeOverlay(ov) {
    ov.classList.remove("open");
    if (ov === els.win) setTimeout(function () { els.confetti.innerHTML = ""; }, 300);
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  function anyOverlayOpen() {
    return els.confirm.classList.contains("open") || els.win.classList.contains("open");
  }

  function newGame() {
    var keepGoal = state.goal, keepMuted = state.muted;
    state = defaults();
    state.goal = keepGoal;
    state.muted = keepMuted;
    save();
    render();
    toast("C'est reparti\u00a0!");
  }

  /* ---------- Écouteurs ---------- */
  document.querySelectorAll(".team").forEach(function (card) {
    var team = card.getAttribute("data-team");
    card.querySelectorAll("[data-delta]").forEach(function (btn) {
      btn.addEventListener("click", function () {
        addPoints(team, parseInt(btn.getAttribute("data-delta"), 10));
      });
    });
  });

  els.prev.addEventListener("click", function () { setRound(state.round - 1); });
  els.next.addEventListener("click", function () { setRound(state.round + 1); });

  document.querySelectorAll("[data-bdm-team]").forEach(function (b) {
    b.addEventListener("click", function () {
      state.bdm.team = b.getAttribute("data-bdm-team");
      save();
      render();
    });
  });
  $("bdmGood").addEventListener("click", function () { bdmAdd(1); });
  $("bdmMinus").addEventListener("click", function () { bdmAdd(-1); });
  $("bdmFail").addEventListener("click", bdmFail);

  function commitGoal() {
    state.goal = clampInt(els.goal.value, 1, 999, state.goal);
    els.goal.value = state.goal;
    save();
    render();
  }
  els.goal.addEventListener("change", commitGoal);
  els.goal.addEventListener("blur", commitGoal);
  els.goal.addEventListener("keydown", function (e) {
    if (e.key === "Enter") { els.goal.blur(); }
  });

  els.sound.addEventListener("click", function () {
    state.muted = !state.muted;
    save();
    render();
    if (!state.muted) buzz("mayo", false);
  });

  var root = document.documentElement;
  var canFs = !!(root.requestFullscreen || root.webkitRequestFullscreen);
  if (!canFs) els.fs.hidden = true;
  function toggleFs() {
    try {
      var fsEl = document.fullscreenElement || document.webkitFullscreenElement;
      if (fsEl) {
        (document.exitFullscreen || document.webkitExitFullscreen).call(document);
      } else {
        var req = root.requestFullscreen || root.webkitRequestFullscreen;
        var res = req.call(root);
        if (res && res.catch) res.catch(function () {});
      }
    } catch (e) { /* ignore */ }
  }
  els.fs.addEventListener("click", toggleFs);

  $("newGame").addEventListener("click", function () { openOverlay(els.confirm, $("confirmNo")); });
  $("confirmNo").addEventListener("click", function () { closeOverlay(els.confirm); });
  $("confirmYes").addEventListener("click", function () { closeOverlay(els.confirm); newGame(); });

  $("winStay").addEventListener("click", function () { closeOverlay(els.win); });
  $("winGo").addEventListener("click", function () {
    closeOverlay(els.win);
    if (winTeam) state.bdm.team = winTeam;
    state.bdm.count = 0;
    state.round = BDM_INDEX;
    save();
    render();
  });

  [els.confirm, els.win].forEach(function (ov) {
    ov.addEventListener("click", function (e) { if (e.target === ov) closeOverlay(ov); });
  });

  document.addEventListener("keydown", function (e) {
    if (e.target === els.goal || e.metaKey || e.ctrlKey || e.altKey) return;
    if (anyOverlayOpen()) {
      if (e.key === "Escape") { closeOverlay(els.confirm); closeOverlay(els.win); }
      return;
    }
    var k = e.key.toLowerCase();
    if (k === "k") addPoints("ketchup", e.shiftKey ? -1 : 1);
    else if (k === "m") addPoints("mayo", e.shiftKey ? -1 : 1);
    else if (e.key === "ArrowLeft") setRound(state.round - 1);
    else if (e.key === "ArrowRight") setRound(state.round + 1);
    else if (k === "s") els.sound.click();
    else if (k === "f" && canFs) toggleFs();
    else if (e.key === " " && state.round === BDM_INDEX) {
      if (document.activeElement && document.activeElement.tagName === "BUTTON") return;
      e.preventDefault();
      bdmAdd(1);
    }
    else return;
  });

  render();
})();
</script>
</body>
</html>
